<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversation Analyzer</title>
    <base href="/">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Conversation Analyzer</h1>
            <div class="tabs">
                <button class="tab-link active" data-tab="record-tab">Note Taking</button>
                <button class="tab-link" data-tab="tasks-tab">Tasks</button>
            </div>
        </header>

        <main>
            <!-- Note Taking / Transcription Tab -->
            <div id="record-tab" class="tab-content active">
                <div id="recorder-ui">
                    <p id="instructions">Speak to take notes.</p>
                    <div class="controls">
                        <button id="start-recognition-btn" class="primary-btn">
                            <i class="fas fa-microphone"></i> Start Listening
                        </button>
                        <button id="stop-recognition-btn" class="secondary-btn hidden">
                            <i class="fas fa-stop"></i> Stop Listening
                        </button>
                    </div>

                    <div class="transcription-container">
                        <textarea id="transcription-text" placeholder="Your notes will appear here..." rows="10"></textarea>
                    </div>

                    <div class="action-buttons">
                        <button id="analyze-btn" class="primary-btn">Analyze</button>
                    </div>
                </div>

                <div id="analysis-result" class="hidden">
                    <h2>Analysis Result</h2>

                    <div class="analysis-section">
                        <h3>Identified Tasks</h3>
                        <ul id="new-tasks-list"></ul>
                        <button id="add-to-tasks-btn" class="secondary-btn hidden">Add to Tasks List</button>
                    </div>

                    <div class="analysis-section">
                        <h3>Flow Diagram</h3>
                        <div class="mermaid" id="mermaid-diagram">
                            <!-- Mermaid diagram will be rendered here -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tasks Tab -->
            <div id="tasks-tab" class="tab-content">
                <div id="task-list-container">
                    <!-- Tasks will be loaded here -->
                    <p id="loading-tasks">Loading tasks...</p>
                </div>
            </div>
        </main>
    </div>

    <script src="main.js"></script>
    <script>
        mermaid.initialize({ startOnLoad: false });
    </script>
</body>
</html>
