<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversation Analyzer</title>
    <base href="/">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Conversation Analyzer</h1>
            <button id="theme-toggle" class="theme-toggle" title="Toggle Dark Mode">
                <i class="fas fa-moon"></i>
            </button>
            <div class="tabs">
                <button class="tab-link active" data-tab="record-tab">Note Taking</button>
                <button class="tab-link" data-tab="notes-tab">Saved Notes</button>
                <button class="tab-link" data-tab="tasks-tab">Tasks</button>
            </div>
        </header>

        <main>
            <!-- Note Taking / Transcription Tab -->
            <div id="record-tab" class="tab-content active">
                <div id="recorder-ui">
                    <p id="instructions">Speak to take notes.</p>
                    <div class="controls">
                        <button id="start-recognition-btn" class="primary-btn">
                            <i class="fas fa-microphone"></i> Start Listening
                        </button>
                        <button id="stop-recognition-btn" class="secondary-btn hidden">
                            <i class="fas fa-stop"></i> Stop Listening
                        </button>
                    </div>

                    <div id="recording-visualizer" class="hidden">
                        <div class="wave"></div>
                        <div class="wave"></div>
                        <div class="wave"></div>
                        <div class="wave"></div>
                        <div class="wave"></div>
                    </div>

                    <div class="transcription-container">
                        <textarea id="transcription-text" placeholder="Your notes will appear here..." rows="10"></textarea>
                    </div>

                    <div class="action-buttons">
                        <button id="analyze-btn" class="primary-btn">Analyze</button>
                    </div>
                </div>

                <div id="analysis-result" class="hidden">
                    <div class="analysis-header">
                        <h2>Analysis Result</h2>
                        <div class="header-actions">
                            <div class="translate-control">
                                <select id="translate-lang-select">
                                    <option value="Spanish">Spanish</option>
                                    <option value="French">French</option>
                                    <option value="German">German</option>
                                    <option value="Portuguese">Portuguese</option>
                                    <option value="Chinese">Chinese</option>
                                    <option value="Japanese">Japanese</option>
                                    <option value="Hindi">Hindi</option>
                                </select>
                                <button id="translate-btn" class="secondary-btn small-btn" title="Translate Analysis"><i class="fas fa-language"></i></button>
                            </div>
                            <button id="save-note-btn" class="secondary-btn small-btn"><i class="fas fa-save"></i> Save Note</button>
                        </div>
                    </div>

                    <div class="analysis-section" id="analysis-meta">
                        <!-- Title and Summary will be injected here -->
                        <div class="meta-field">
                            <label for="analysis-title">Title:</label>
                            <input type="text" id="analysis-title" placeholder="Note Title">
                        </div>
                        <div class="meta-field">
                            <label for="analysis-summary">Summary:</label>
                            <div class="input-with-action">
                                <textarea id="analysis-summary" rows="2" placeholder="Summary..."></textarea>
                                <button id="tts-summary-btn" class="action-icon-btn" title="Read Aloud"><i class="fas fa-volume-up"></i></button>
                                <button id="copy-summary-btn" class="action-icon-btn" title="Copy Summary"><i class="fas fa-copy"></i></button>
                            </div>
                        </div>
                        <div class="meta-field">
                            <label for="analysis-tags">Tags (comma separated):</label>
                            <input type="text" id="analysis-tags" placeholder="e.g. Work, Meeting, Important">
                        </div>
                    </div>

                    <div class="analysis-section">
                        <h3>Identified Tasks</h3>
                        <ul id="new-tasks-list"></ul>
                        <button id="add-to-tasks-btn" class="secondary-btn hidden">Add to Tasks List</button>
                    </div>

                    <div class="analysis-section">
                        <h3>Flow Diagram</h3>
                        <div class="mermaid" id="mermaid-diagram">
                            <!-- Mermaid diagram will be rendered here -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Saved Notes Tab -->
            <div id="notes-tab" class="tab-content">
                <div id="note-list-view">
                    <div class="search-bar">
                        <input type="text" id="note-search-input" placeholder="Search notes by title or content...">
                    </div>
                    <div id="note-list-container">
                        <!-- Notes will be loaded here -->
                        <div class="spinner-container">
                            <div class="spinner"></div>
                            <p>Loading notes...</p>
                        </div>
                    </div>
                </div>
                <div id="note-detail-view" class="hidden">
                    <div class="detail-header">
                        <button id="back-to-notes-btn" class="secondary-btn small-btn"><i class="fas fa-arrow-left"></i> Back</button>
                        <div class="detail-actions">
                            <button id="edit-note-btn" class="primary-btn small-btn"><i class="fas fa-edit"></i> Edit</button>
                            <button id="export-note-btn" class="secondary-btn small-btn"><i class="fas fa-download"></i> Export</button>
                        </div>
                    </div>
                    <div id="note-detail-content">
                        <!-- Note content will be loaded here -->
                    </div>
                    <div id="note-edit-form" class="hidden edit-note-form">
                        <!-- Edit form injected here -->
                    </div>
                </div>
            </div>

            <!-- Tasks Tab -->
            <div id="tasks-tab" class="tab-content">
                <div class="task-filters">
                    <label>
                        Status:
                        <select id="filter-status">
                            <option value="all">All</option>
                            <option value="active">Active</option>
                            <option value="done">Completed</option>
                        </select>
                    </label>
                    <label>
                        Priority:
                        <select id="filter-priority">
                            <option value="all">All</option>
                            <option value="High">High</option>
                            <option value="Medium">Medium</option>
                            <option value="Low">Low</option>
                        </select>
                    </label>
                </div>
                <div id="task-list-container">
                    <!-- Tasks will be loaded here -->
                    <div class="spinner-container">
                        <div class="spinner"></div>
                        <p>Loading tasks...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <!-- Modal Container -->
    <div id="modal-container" class="hidden"></div>

    <script src="main.js"></script>
    <script>
        mermaid.initialize({ startOnLoad: false });
    </script>
</body>
</html>
